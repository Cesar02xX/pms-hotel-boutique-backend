services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pms_hotel_db}
      POSTGRES_USER: ${POSTGRES_USER:-pms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms_user} -d ${POSTGRES_DB:-pms_hotel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pms_postgres_data: