name: Backend CI

on:
  pull_request:
    branches: [develop, development, main]
  workflow_dispatch:
  workflow_call: # reutilizado por backend-release.yml antes de publicar

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-analyze:
    name: Build, tests y SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pms_hotel_db
          POSTGRES_USER: pms_user
          POSTGRES_PASSWORD: pms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms_user -d pms_hotel_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial para blame / código nuevo

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y tests (mvn clean verify + JaCoCo)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Verificar disponibilidad de SonarQube
        id: sonar-check
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::notice title=SonarQube omitido::SONAR_TOKEN o SONAR_HOST_URL no están configurados."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsS --max-time 20 "${SONAR_HOST_URL%/}/api/system/status" | grep -q '"status":"UP"'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=SonarQube omitido::${SONAR_HOST_URL} no responde UP desde el runner."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Análisis SonarQube + Quality Gate
        if: steps.sonar-check.outputs.enabled == 'true'
        run: |
          ./mvnw -B -ntp sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            ${SONAR_PROJECT_KEY:+-Dsonar.projectKey="$SONAR_PROJECT_KEY"} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  docker-build:
    name: Docker build (sin push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pms-hotel-boutique-backend:pr-${{ github.event.pull_request.number || github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
